name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      # The split continuation of https://github.com/swiftlang/swift/pull/91981 is not in a nightly toolchain
      # yet, so the Linux tests run with a toolchain of that PR, which exists for Ubuntu 26.04 on aarch64.
      # Revert this once the PR landed in a nightly toolchain.
      linux_swift_versions: '["6.4"]'
      linux_os: resolute
      linux_host_archs: '["aarch64"]'
      linux_setup_command: |
        if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
        $SUDO apt-get update
        $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y curl
        curl -fsSL -o /tmp/toolchain.tar.gz https://download.swift.org/tmp/pull-request/91981/15/ubuntu2604/PR-ubuntu2604.tar.gz
        $SUDO tar -xzf /tmp/toolchain.tar.gz -C /
        rm /tmp/toolchain.tar.gz
      # Docker's default seccomp profile blocks `io_uring`. The io_uring job runs the tests on both epoll and
      # io_uring, and the test log names the backends that the tests ran on.
      linux_docker_security_options: '["seccomp=unconfined"]'
      linux_command: |
        Test: swift test --traits ExperimentalIO
        IOUring-Test: swift test --traits ExperimentalIOUring
      # The other platforms and the SDK builds run in the `platforms` job.
      enable_windows: false
      enable_freebsd: false
      enable_linux_static_sdk_build: false
      enable_android_sdk_build: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_macos: false
      enable_macos_swiftly: false
      enable_cxx_interop: false

  platforms:
    name: Platforms
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      # A second call, so that the SDK builds run on x86_64: the Android NDK has no aarch64 Linux linker.
      name: package-test-platforms
      windows_swift_versions: '["nightly-main"]'
      # The toolchain installed on the runner fails to start `swift test` with STATUS_DLL_NOT_FOUND.
      windows_use_docker: true
      linux_static_sdk_versions: '["6.4"]'
      android_sdk_versions: '["6.4"]'
      wasm_sdk_versions: '["6.4"]'
      # The package doesn't build on FreeBSD yet: it has no readiness backend for FreeBSD's kqueue.
      enable_freebsd: false
      enable_linux: false
      enable_macos: false
      enable_macos_swiftly: false
      enable_embedded_wasm_sdk_build: false
      enable_cxx_interop: false

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.19
    with:
      license_header_check_project_name: "Swift Platform Executors"
