name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      # The split continuation of https://github.com/swiftlang/swift/pull/91981 is not in a nightly toolchain
      # yet, so the Linux tests run with a toolchain of that PR, which exists for Ubuntu 26.04 on aarch64.
      # Revert this once the PR landed in a nightly toolchain.
      linux_swift_versions: "[\"6.4\"]"
      linux_os_versions: "[\"resolute\"]"
      linux_host_archs: "[\"aarch64\"]"
      linux_pre_build_command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl && curl -fsSL -o /tmp/toolchain.tar.gz https://download.swift.org/tmp/pull-request/91981/9/ubuntu2604/PR-ubuntu2604.tar.gz && tar -xzf /tmp/toolchain.tar.gz -C / && rm /tmp/toolchain.tar.gz"
      windows_swift_versions: "[\"nightly\"]"
      linux_build_command: swift test --traits ExperimentalIO

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      license_header_check_project_name: "Swift Platform Executors"

  io-uring-tests:
    # The shared Linux job builds without the io_uring trait, and its container uses Docker's default seccomp
    # profile, which blocks `io_uring`. This job allows `io_uring` and runs the tests on both epoll and
    # io_uring. The test log names the backends that the tests ran on.
    name: Test / Linux io_uring (6.4 - resolute - aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: swift:6.4-resolute
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pre-build
        # The same toolchain of https://github.com/swiftlang/swift/pull/91981 as the shared Linux job.
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl && curl -fsSL -o /tmp/toolchain.tar.gz https://download.swift.org/tmp/pull-request/91981/9/ubuntu2604/PR-ubuntu2604.tar.gz && tar -xzf /tmp/toolchain.tar.gz -C / && rm /tmp/toolchain.tar.gz
      - name: Build / Test
        run: swift test --traits ExperimentalIOUring

  cmake-build:
    # CMake does not discover sources on its own, so this job checks that the CMake build compiles the same
    # sources as SwiftPM and builds it with the I/O interfaces.
    name: CMake Build (6.4 - resolute - aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: swift:6.4-resolute
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install apt dependencies
        run: apt-get -qq update && DEBIAN_FRONTEND=noninteractive apt-get -qq -y install curl cmake ninja-build jq
      - name: Install the toolchain of https://github.com/swiftlang/swift/pull/91981
        run: curl -fsSL -o /tmp/toolchain.tar.gz https://download.swift.org/tmp/pull-request/91981/9/ubuntu2604/PR-ubuntu2604.tar.gz && tar -xzf /tmp/toolchain.tar.gz -C / && rm /tmp/toolchain.tar.gz
      - name: CMake version
        run: cmake --version
      - name: Configure with CMake
        run: |
          # The CMake File API query is what scripts/check-cmake-sources.sh reads the CMake sources from.
          mkdir -p build/.cmake/api/v1/query
          touch build/.cmake/api/v1/query/codemodel-v2
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DSwiftPlatformExecutors_ENABLE_EXPERIMENTAL_IO=YES
      - name: Validate CMake source lists
        run: scripts/check-cmake-sources.sh build
      - name: Build with CMake
        run: cmake --build build
